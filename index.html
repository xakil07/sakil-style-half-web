            },

                price: 369,

                desc: "Bold typography printed on relaxed-fit distressed washed cotton. Designed for urban comfort." 
            },
            { 
                id: 6, 
                title: "Classic Earth Brown Polo Tee", 
                price: 369, 
                img: "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/f16854a84c1cf1abedeccc6d6e576078.jpg", 
                desc: "Elegantly tailored brown polo style t-shirt with ribbed collar and comfortable stretch." 
            },
            { 
                id: 7, 
                title: "Premium brown Polo shirt", 
                price: 789, 
                img: "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/file_00000000118882118fb98454cd248639.png", 
                desc: "Retro-styled vintage automotive graphic on heavy-weight acid wash cotton fabric." 
            },
            { 
                id: 8, 
                title: "Sporty Piping Black Tee", 
                price: 369, 
                img: "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/257d870e812c1b8156c506898c899b22.jpg", 
                desc: "Sleek obsidian black crew neck with breathable knit blend and sleek modern silhouette." 
            },
            { 
                id: 9, 
                title: "Minimalist Beige Casual Tee", 
                price: 369, 
                img: "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/10d6b78f568b14dc0c249abb68b196f7.jpg", 
                desc: "Soft earth-tone beige half-sleeve top ideal for daily casual wear and summer outings." 
            },
            { 
                id: 10, 
                title: "Worldwide Acid Wash Streetwear Tee", 
                price: 369, 
                img: "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/0844444531791d41868e9e9e29e79b43.jpg", 
                desc: "Bold typography printed on relaxed-fit distressed washed cotton. Designed for urban comfort." 
            },
            { 
                id: 11, 
                title: "Classic Earth Brown Polo Tee", 
                price: 369, 
                img: "https://raw.githubusercontent.com/xakil07/sakil-style-half-web/refs/heads/main/f16854a84c1cf1abedeccc6d6e576078.jpg", 
                desc: "Elegantly tailored brown polo style t-shirt with ribbed collar and comfortable stretch." 
            },
            { 
                id: 12, 
                title: "Embroidered White Ringer Tee", 
                price: 369, 
                img: "https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=800&q=80", 
                desc: "Crisp white cotton ringer t-shirt finished with detailed chest emblem embroidery." 
            }
        ];

        let cart = [];
        let selectedModalSizeState = 'M';
        let currentModalProductId = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
        });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (!grid) return;
            grid.innerHTML = '';

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-zinc-900 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-zinc-800 flex flex-col justify-between group";
                
                card.innerHTML = `
                    <div class="relative overflow-hidden bg-zinc-950 aspect-[4/5] cursor-pointer" onclick="showDetails(${p.id})">
                        <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-3 right-3 bg-black/80 text-white text-xs font-bold px-2.5 py-1 rounded-full border border-zinc-700">
                            ${p.price}৳
                        </div>
                    </div>
                    <div class="p-5 space-y-3 flex flex-col flex-grow justify-between">
                        <div>
                            <h4 class="font-bold text-white text-base group-hover:text-zinc-300 transition cursor-pointer" onclick="showDetails(${p.id})">${p.title}</h4>
                            <p class="text-xs text-zinc-400 mt-1 line-clamp-2">${p.desc}</p>
                        </div>
                        <button onclick="showDetails(${p.id})" class="w-full bg-zinc-800 hover:bg-white hover:text-black text-white text-xs font-bold py-2.5 px-3 rounded-xl transition duration-200 flex items-center justify-center space-x-1.5 border border-zinc-700">
                            <i class="fa-solid fa-eye"></i>
                            <span>Quick View</span>
                        </button>
                    </div>
                `;
                
                // এখানে কার্ডটি গ্রিড কন্টেইনারে যুক্ত করা হয়েছে
                grid.appendChild(card);
            });
        }

        function showDetails(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            currentModalProductId = product.id;
            
            document.getElementById('modal-img').src = product.img;
            document.getElementById('modal-title').innerText = product.title;
            document.getElementById('modal-desc').innerText = product.desc;
            
            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        function selectModalSize(size) {
            selectedModalSizeState = size;
            document.querySelectorAll('.modal-size-btn').forEach(btn => {
                if (btn.innerText === size) {
                    btn.classList.add('border-white', 'bg-zinc-800');
                } else {
                    btn.classList.remove('border-white', 'bg-zinc-800');
                }
            });
        }

        function openCartModal() {
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function updateCartUI() {
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');
            const listEl = document.getElementById('cart-items-list');

            let totalCount = 0;
            let totalPrice = 0;

            listEl.innerHTML = '';

            if (cart.length === 0) {
                listEl.innerHTML = `<p class="text-zinc-500 text-center py-10 text-sm">Your cart is empty.</p>`;
            } else {
                cart.forEach((item, index) => {
                    totalCount += item.qty;
                    totalPrice += item.price * item.qty;

                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800";
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <img src="${item.img}" class="w-12 h-12 object-cover rounded-lg">
                            <div>
                                <h5 class="text-xs font-bold text-white line-clamp-1">${item.title}</h5>
                                <p class="text-[11px] text-zinc-400">Size: ${item.size} | Qty: ${item.qty}</p>
                                <p class="text-xs font-semibold text-white">${item.price * item.qty}৳</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-zinc-500 hover:text-red-400 p-1">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    `;
                    listEl.appendChild(div);
                });
            }

            countEl.innerText = totalCount;
            totalEl.innerText = totalPrice + '৳';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        document.getElementById('modal-add-btn').addEventListener('click', () => {
            const product = products.find(p => p.id === currentModalProductId);
            if (!product) return;

            const existingIndex = cart.findIndex(item => item.id === product.id && item.size === selectedModalSizeState);
            if (existingIndex > -1) {
                cart[existingIndex].qty += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title,
                    price: product.price,
                    img: product.img,
                    size: selectedModalSizeState,
                    qty: 1
                });
            }

            updateCartUI();
            closeDetailsModal();
            openCartModal();
        });

        function checkoutWhatsApp() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !phone || !address) {
                alert('অনুগ্রহ করে নাম, ফোন নম্বর এবং সম্পূর্ণ ঠিকানা পূরণ করুন।');
                return;
            }

            if (cart.length === 0) {
                alert('আপনার কার্ট খালি রয়েছে!');
                return;
            }

            let message = `*New Order - Sakil Style Hub*\n\n*Customer Details:*\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\n\n*Order Items:*\n`;
            
            let total = 0;
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.title} (${item.size}) - Qty: ${item.qty} - ${item.price * item.qty}৳\n`;
                total += item.price * item.qty;
            });

            message += `\n*Total Amount: ${total}৳*`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/8801321543071?text=${encodedMessage}`, '_blank');
        }
    </script>
